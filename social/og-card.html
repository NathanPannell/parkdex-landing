<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Parkdex share card source</title>
    <!-- Source for public/og-image.jpg. Render it at 1200x630; see social/README.md. -->
    <script type="module">import '../src/shared-base.css';</script>
    <style>
      html, body { margin: 0; }
      /* Few, large elements kept near the center so previews stay legible at phone size
         and survive the square crops some apps apply. */
      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--color-ink);
        color: var(--color-hero-text);
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 45%;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, var(--color-shade-48) 0%, var(--color-shade-38) 55%, var(--color-shade-28) 100%);
      }
      .kip {
        position: relative;
        width: 210px;
        margin-bottom: -6px;
        height: auto;
        filter: drop-shadow(0 18px 24px rgb(0 0 0 / 35%));
      }
      .copy { position: relative; }
      .wordmark {
        margin: 0;
        font-family: var(--font-display), sans-serif;
        font-size: 132px;
        font-weight: 780;
        line-height: .8;
        letter-spacing: -.045em;
      }
      .wordmark span { color: var(--color-accent); }
      .cta {
        display: inline-block;
        margin: 30px 0 0;
        padding: 20px 34px;
        border-radius: 14px;
        background: var(--color-accent);
        color: var(--color-ink);
        font-family: var(--font-display), sans-serif;
        font-size: 44px;
        font-weight: 780;
        letter-spacing: -.03em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="photo" src="/images/island-hero.webp" alt="" />
      <div class="scrim"></div>
      <img class="kip" src="/images/kip/kip-wave.webp" alt="" />
      <div class="copy">
        <p class="wordmark">Parkdex<span>.</span></p>
        <p class="cta">Explore with Parkdex <span aria-hidden="true">→</span></p>
      </div>
    </div>
  </body>
</html>
