<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Parkdex share card source</title>
    <!-- Source for public/og-image.jpg. Render it at 1200x630; see social/README.md. -->
    <script type="module">import '../src/fan-page.css';</script>
    <style>
      html, body { margin: 0; }
      /* Mascot, wordmark and a short action, with player flags planted on the
         homepage's hill along the bottom. Centered so it survives square crops. */
      .card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: radial-gradient(circle at 92% 12%, #fff3c4 0 70px, transparent 72px), linear-gradient(var(--sky), var(--cream) 80%);
        color: var(--ink);
      }
      .copy { position: relative; z-index: 2; padding-bottom: 90px; }
      .kip { position: relative; z-index: 2; width: 270px; height: auto; margin-bottom: -120px; }
      .wordmark {
        margin: 0;
        font-family: var(--display);
        font-size: 140px;
        font-weight: 800;
        line-height: .8;
        letter-spacing: -.05em;
      }
      .wordmark span { color: var(--orange); }
      .cta {
        display: inline-block;
        margin: 30px 0 0;
        padding: 16px 30px;
        border: 4px solid var(--ink);
        border-radius: 999px;
        background: var(--orange);
        box-shadow: 0 6px 0 var(--ink);
        font-family: var(--display);
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -.03em;
      }
      .card .hill { position: absolute; inset: auto 0 0; height: 210px; margin: 0; }
      .card .hill__flag { display: block; }
      .card .hill__flag--1 { left: 5%; bottom: 40%; --w: 92px; }
      .card .hill__flag--2 { left: 36%; bottom: 46%; --w: 60px; }
      .card .hill__flag--3 { left: 63%; bottom: 30%; --w: 70px; }
      .card .hill__flag--4 { right: 15%; bottom: 44%; --w: 96px; }
      .card .hill__flag--5 { right: 3%; bottom: 52%; --w: 62px; }
      .card .hill__flag--6 { display: none; }
      .card .planted__cloth { animation: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="kip" src="/images/kip/kip-wave.webp" alt="" />
      <div class="copy">
        <p class="wordmark">Parkdex<span>.</span></p>
        <p class="cta">Plant your flag <span aria-hidden="true">→</span></p>
      </div>
      <!-- flag-hill -->
    </div>
  </body>
</html>
