<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Parkdex share card source</title>
    <!-- Source for public/og-image.jpg. Render it at 1200x630; see social/README.md. -->
    <script type="module">import '../src/shared-base.css';</script>
    <style>
      html, body { margin: 0; }
      /* Mascot, wordmark, then a short action on one flat colour. Kept compact and centered so it
         reads at phone size and survives square thumbnail crops. */
      .card {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 44px;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--color-paper);
        color: var(--color-ink);
      }
      .kip {
        width: 300px;
        height: auto;
      }
      .wordmark {
        margin: 0;
        font-family: var(--font-display), sans-serif;
        font-size: 138px;
        font-weight: 780;
        line-height: .8;
        letter-spacing: -.045em;
      }
      .wordmark span { color: var(--color-accent); }
      .cta {
        display: inline-block;
        margin: 34px 0 0;
        padding: 20px 32px;
        border-radius: 14px;
        background: var(--color-accent);
        color: var(--color-ink);
        font-family: var(--font-display), sans-serif;
        font-size: 48px;
        font-weight: 780;
        letter-spacing: -.03em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="kip" src="/images/kip/kip-wave.webp" alt="" />
      <div>
        <p class="wordmark">Parkdex<span>.</span></p>
        <p class="cta">Collect park badges <span aria-hidden="true">→</span></p>
      </div>
    </div>
  </body>
</html>
