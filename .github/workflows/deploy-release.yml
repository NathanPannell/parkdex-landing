name: Queue landing release

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    secrets:
      VERCEL_DEPLOY_TOKEN:
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.deploy.outputs.source_sha }}
      release_id:
        value: ${{ jobs.deploy.outputs.release_id }}
      vercel_deployment_url:
        value: ${{ jobs.deploy.outputs.vercel_deployment_url }}

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.target == 'staging' || inputs.target == 'production'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: parkdex-landing-release-${{ inputs.target }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'production' && 'https://www.parkdex.app' || 'https://staging.parkdex.app' }}
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      release_id: ${{ steps.queue.outputs.release_id }}
      vercel_deployment_url: ${{ steps.queue.outputs.vercel_deployment_url }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target }}
      EXPECTED_COMMIT_SHA: ${{ inputs.source_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
      VERCEL_PRODUCTION_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate merge-only source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT_SHA" ]]
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          if [[ "$TARGET_ENVIRONMENT" == production ]]; then branch=main; else branch=staging; fi
          [[ "$GITHUB_REF" == "refs/heads/$branch" ]]
          [[ "$GITHUB_SHA" == "$EXPECTED_COMMIT_SHA" ]]
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
          if [[ "$current_sha" != "$EXPECTED_COMMIT_SHA" ]]; then
            echo "A newer $branch commit exists; refusing to queue a stale deployment." >&2
            exit 1
          fi
          echo "sha=$EXPECTED_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@50.1.3

      - name: Queue Vercel deployment
        id: queue
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is required}"
          if [[ "$TARGET_ENVIRONMENT" == staging ]]; then
            project_id="${VERCEL_STAGING_PROJECT_ID:?VERCEL_STAGING_PROJECT_ID is required}"
            project_name=parkdex-landing-staging
            app_url=https://staging.web.parkdex.app
            stable_url=https://staging.parkdex.app
            config_args=(--local-config vercel.staging.json)
          else
            project_id="${VERCEL_PRODUCTION_PROJECT_ID:?VERCEL_PRODUCTION_PROJECT_ID is required}"
            project_name=parkdex-landing
            app_url=https://web.parkdex.app
            stable_url=https://www.parkdex.app
            config_args=()
          fi
          [[ "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]]
          [[ "$project_id" =~ ^prj_[A-Za-z0-9]+$ ]]
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s","projectName":"%s"}\n' \
            "$VERCEL_ORG_ID" "$project_id" "$project_name" > .vercel/project.json
          release_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stdout="$RUNNER_TEMP/vercel.out"
          stderr="$RUNNER_TEMP/vercel.err"
          if ! vercel deploy --yes --prod --skip-domain --no-wait --no-color \
            "${config_args[@]}" --build-env "VITE_APP_URL=$app_url" \
            --meta "sourceCommit=$EXPECTED_COMMIT_SHA" \
            --meta "landingReleaseId=$release_id" \
            --meta "landingEnvironment=$TARGET_ENVIRONMENT" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" \
            >"$stdout" 2>"$stderr"; then
            tail -n 30 "$stderr" >&2
            exit 1
          fi
          deployment_url="$(tr -d '\r' < "$stdout" | tail -n 1)"
          [[ "$deployment_url" =~ ^https://[A-Za-z0-9.-]+\.vercel\.app/?$ ]] || {
            echo 'Vercel did not return a deployment URL.' >&2
            exit 1
          }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "vercel_deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "## Landing $TARGET_ENVIRONMENT deployment queued"
            echo
            echo "- Source commit: \`$EXPECTED_COMMIT_SHA\`"
            echo "- Release ID: \`$release_id\`"
            echo "- Vercel deployment: $deployment_url"
            echo "- Stable site after agent-controlled alias: $stable_url"
            echo '- This job exits after Vercel accepts the request. An agent must confirm READY, assign the stable domain, and browser-test the waitlist flow.'
          } >> "$GITHUB_STEP_SUMMARY"
